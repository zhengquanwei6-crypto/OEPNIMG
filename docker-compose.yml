services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: oepnimg-web:latest
    container_name: oepnimg-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/oepnimg.db
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET（≥32 字符）}
      MASTER_KEY: ${MASTER_KEY:?请在 .env 中设置 MASTER_KEY（≥32 字符）}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-https://api.openai.com/v1}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-4o-mini}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-20000}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-2000000}
      # 通过纯 HTTP 部署（IP 直连，无 HTTPS）时设为 false
      # 上了 HTTPS（如 Caddy/Nginx 反代）后建议设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - oepnimg-data:/data
    # 资源限制（防止跑飞吃光宿主机）
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
    # 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 健康检查：调用 /api/health（验证 DB 连通性）
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  oepnimg-data:
    driver: local
